<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climbing log</title>
<meta name="description" content="Oliver's climbing training log">
<meta name="theme-color" content="#f2f2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Climbing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <span class="brand">Climbing log</span>
  <span class="updated" id="updated"></span>
</header>

<main id="view" aria-live="polite">
  <p class="loading">Loading</p>
</main>

<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="today" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6" class="fill"/></svg>
    <span>Today</span>
  </button>
  <button type="button" data-tab="strength">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.5 9 11l4 3.5 7.5-9"/><path d="M3.5 21h17"/></svg>
    <span>Strength</span>
  </button>
  <button type="button" data-tab="climbs">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="17" r="3"/><circle cx="12.5" cy="9.5" r="3"/><circle cx="18" cy="16" r="2.2" class="fill"/></svg>
    <span>Climbs</span>
  </button>
  <button type="button" data-tab="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.5H20M8.5 12H20M8.5 17.5H20"/><circle cx="4.5" cy="6.5" r="1" class="fill"/><circle cx="4.5" cy="12" r="1" class="fill"/><circle cx="4.5" cy="17.5" r="1" class="fill"/></svg>
    <span>Plan</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
